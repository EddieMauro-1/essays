<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>essays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Faustina:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../viewer.css?v=4">
</head>
<body>
<header class="barra" id="barra">
  <div class="rotulo">
    <span class="serie" id="serie"></span>
    <span class="nombre" id="nombre"></span>
  </div>
  <nav class="controles" aria-label="Controles de lectura">
    <button type="button" id="anterior" title="Hoja anterior (←)" aria-label="Hoja anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <label class="contador" title="Ir a la hoja"><input id="numero" type="text" inputmode="numeric" value="1" aria-label="Hoja actual"><span>/ <b id="total">–</b></span></label>
    <button type="button" id="siguiente" title="Hoja siguiente (→)" aria-label="Hoja siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="sep"></span>
    <button type="button" id="alejar" title="Alejar (−)" aria-label="Alejar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button type="button" id="acercar" title="Acercar (+)" aria-label="Acercar"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    <button type="button" id="libro" title="Ver de a dos hojas (modo libro)" aria-label="Modo libro" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13"/></svg></button>
    <button type="button" id="ajustar" title="Ver la hoja entera" aria-label="Ver la hoja entera"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1"/></svg></button>
    <button type="button" id="completa" title="Pantalla completa" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </nav>
</header>
<main class="hojas" id="hojas" aria-live="polite"></main>
<div class="aviso" id="aviso" role="status" hidden></div>
<noscript><p class="sin-js">JavaScript</p></noscript>
<script src="d.js?v=1"></script>
<script src="../viewer.js?v=4"></script>
</body>
</html>
